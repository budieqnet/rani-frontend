<html lang='id'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>RANI AI - PA Medan</title>
    <link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap' rel='stylesheet'>
    <script src='https://cdn.jsdelivr.net/npm/marked/marked.min.js'></script>
    <style>
        :root {
            --court-green: #0a5d3f;
            --court-green-light: #136b4e;
            --court-gold: #d4a843;
            --dark-bg: #f8f9fa;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --ai-msg-bg: rgba(241, 245, 249, 0.95);
            --glass: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--dark-bg);
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ===== ANIMATED BACKGROUND ===== */
        .tech-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(10, 93, 63, 0.25) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(10, 93, 63, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(212, 168, 67, 0.08) 0%, transparent 50%),
                var(--dark-bg);
        }

        /* Grid overlay */
        .cyber-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(10, 93, 63, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(10, 93, 63, 0.15) 1px, transparent 1px);
            background-size: 20px 20px;
            animation: gridPulse 8s ease-in-out infinite;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }

        /* Floating particles */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: var(--court-green-light);
            pointer-events: none;
        }

        .particle:nth-child(1) {
            width: 4px; height: 4px;
            top: 10%; left: 5%;
            animation: floatParticle 12s ease-in-out infinite;
            opacity: 0.6;
        }
        .particle:nth-child(2) {
            width: 6px; height: 6px;
            top: 30%; left: 90%;
            animation: floatParticle 15s ease-in-out infinite 2s;
            opacity: 0.4;
        }
        .particle:nth-child(3) {
            width: 3px; height: 3px;
            top: 60%; left: 15%;
            animation: floatParticle 10s ease-in-out infinite 4s;
            opacity: 0.7;
        }
        .particle:nth-child(4) {
            width: 5px; height: 5px;
            top: 80%; left: 75%;
            animation: floatParticle 14s ease-in-out infinite 1s;
            opacity: 0.5;
        }
        .particle:nth-child(5) {
            width: 4px; height: 4px;
            top: 45%; left: 50%;
            animation: floatParticle 11s ease-in-out infinite 3s;
            opacity: 0.6;
        }
        .particle:nth-child(6) {
            width: 7px; height: 7px;
            top: 15%; left: 40%;
            animation: floatParticle 13s ease-in-out infinite 5s;
            opacity: 0.3;
        }
        .particle:nth-child(7) {
            width: 3px; height: 3px;
            top: 70%; left: 30%;
            animation: floatParticle 9s ease-in-out infinite 0.5s;
            opacity: 0.5;
        }
        .particle:nth-child(8) {
            width: 5px; height: 5px;
            top: 90%; left: 60%;
            animation: floatParticle 16s ease-in-out infinite 3.5s;
            opacity: 0.4;
        }
        .particle:nth-child(9) {
            width: 4px; height: 4px;
            top: 25%; left: 70%;
            animation: floatParticle 11s ease-in-out infinite 2.5s;
            opacity: 0.6;
        }
        .particle:nth-child(10) {
            width: 6px; height: 6px;
            top: 55%; left: 85%;
            animation: floatParticle 13s ease-in-out infinite 1.5s;
            opacity: 0.3;
        }

        @keyframes floatParticle {
            0%, 100% {
                transform: translateY(0) scale(1);
                opacity: 0.3;
            }
            25% {
                transform: translateY(-30px) scale(1.5);
                opacity: 0.8;
            }
            50% {
                transform: translateY(10px) scale(1);
                opacity: 0.5;
            }
            75% {
                transform: translateY(-20px) scale(1.3);
                opacity: 0.7;
            }
        }

        /* Lightning streaks */
        .lightning {
            position: absolute;
            width: 3px;
            background: linear-gradient(to bottom,
                transparent 0%,
                rgba(10, 93, 63, 0.1) 10%,
                rgba(10, 93, 63, 0.8) 30%,
                rgba(212, 168, 67, 1) 50%,
                rgba(10, 93, 63, 0.8) 70%,
                rgba(10, 93, 63, 0.1) 90%,
                transparent 100%
            );
            opacity: 0;
            animation: lightningFlash 6s ease-in-out infinite;
            pointer-events: none;
        }

        .lightning:nth-child(11) {
            left: 8%;
            animation-delay: 0s;
            height: 70%;
            top: 5%;
        }
        .lightning:nth-child(12) {
            left: 25%;
            animation-delay: 1.8s;
            height: 55%;
            top: 25%;
        }
        .lightning:nth-child(13) {
            left: 45%;
            animation-delay: 0.5s;
            height: 65%;
            top: 10%;
        }
        .lightning:nth-child(14) {
            left: 65%;
            animation-delay: 2.5s;
            height: 50%;
            top: 15%;
        }
        .lightning:nth-child(15) {
            left: 82%;
            animation-delay: 1.2s;
            height: 75%;
            top: 5%;
        }
        .lightning:nth-child(16) {
            left: 92%;
            animation-delay: 3.2s;
            height: 45%;
            top: 30%;
        }

        @keyframes lightningFlash {
            0%, 85%, 100% {
                opacity: 0;
            }
            86% {
                opacity: 0.15;
            }
            87% {
                opacity: 1;
                box-shadow:
                    0 0 10px rgba(10, 93, 63, 0.8),
                    0 0 30px rgba(212, 168, 67, 0.6),
                    0 0 60px rgba(212, 168, 67, 0.3);
            }
            88% {
                opacity: 0.3;
            }
            89% {
                opacity: 1;
                box-shadow:
                    0 0 15px rgba(10, 93, 63, 1),
                    0 0 40px rgba(212, 168, 67, 0.8),
                    0 0 80px rgba(212, 168, 67, 0.4);
            }
            90% {
                opacity: 0.6;
            }
            91% {
                opacity: 0.9;
                box-shadow:
                    0 0 8px rgba(10, 93, 63, 0.6),
                    0 0 20px rgba(212, 168, 67, 0.4);
            }
            93% {
                opacity: 0.2;
            }
            95% {
                opacity: 0;
            }
        }

        /* Glow dots */
        .glow-dot {
            position: absolute;
            border-radius: 50%;
            filter: blur(1px);
            animation: glowDot 5s ease-in-out infinite alternate;
        }

        .glow-dot:nth-child(17) {
            width: 8px; height: 8px;
            top: 20%; left: 15%;
            background: var(--court-gold);
            box-shadow: 0 0 15px var(--court-gold), 0 0 30px var(--court-gold);
            animation-delay: 0s;
        }
        .glow-dot:nth-child(18) {
            width: 6px; height: 6px;
            top: 65%; left: 80%;
            background: var(--court-green-light);
            box-shadow: 0 0 12px var(--court-green-light), 0 0 25px var(--court-green-light);
            animation-delay: 1.5s;
        }
        .glow-dot:nth-child(19) {
            width: 10px; height: 10px;
            top: 40%; left: 45%;
            background: rgba(212, 168, 67, 0.6);
            box-shadow: 0 0 20px rgba(212, 168, 67, 0.4), 0 0 40px rgba(212, 168, 67, 0.2);
            animation-delay: 3s;
        }
        .glow-dot:nth-child(20) {
            width: 5px; height: 5px;
            top: 85%; left: 25%;
            background: var(--court-green-light);
            box-shadow: 0 0 10px var(--court-green-light), 0 0 20px var(--court-green-light);
            animation-delay: 2s;
        }
        .glow-dot:nth-child(21) {
            width: 7px; height: 7px;
            top: 10%; left: 70%;
            background: var(--court-gold);
            box-shadow: 0 0 14px var(--court-gold), 0 0 28px var(--court-gold);
            animation-delay: 4s;
        }

        @keyframes glowDot {
            0% {
                transform: scale(1);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.5);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 0.3;
            }
        }

        /* ===== HEADER ===== */
        header {
            position: relative;
            z-index: 10;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(10, 93, 63, 0.2);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
        }

        .logo-text {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(10, 93, 63, 0.4);
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .logo-text h1 {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1e293b, #0a5d3f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        button#clear-chat {
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.1);
            color: rgba(0, 0, 0, 0.6);
            font-size: 0.75rem;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button#clear-chat:hover {
            background: rgba(0, 0, 0, 0.1);
            color: #1e293b;
        }

        /* ===== CHAT CONTAINER ===== */
        #chat-container {
            position: relative;
            z-index: 5;
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        /* Scrollbar styling */
        #chat-container::-webkit-scrollbar {
            width: 6px;
        }
        #chat-container::-webkit-scrollbar-track {
            background: transparent;
        }
        #chat-container::-webkit-scrollbar-thumb {
            background: rgba(10, 93, 63, 0.3);
            border-radius: 3px;
        }
        #chat-container::-webkit-scrollbar-thumb:hover {
            background: rgba(10, 93, 63, 0.5);
        }

        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 15px;
            line-height: 1.6;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease-out;
            position: relative;
            word-wrap: break-word;
            backdrop-filter: blur(10px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--court-green), var(--court-green-light));
            color: white;
            border-bottom-right-radius: 2px;
            box-shadow: 0 4px 15px rgba(10, 93, 63, 0.3);
        }

        .ai-message {
            align-self: flex-start;
            background: var(--ai-msg-bg);
            color: var(--text-dark);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-bottom-left-radius: 2px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .ai-row {
            align-self: flex-start;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            max-width: 85%;
        }

        .ai-row .message {
            max-width: 100%;
        }

        .message p { margin-bottom: 8px; }
        .message p:last-child { margin-bottom: 0; }
        .message ul, .message ol { margin-left: 20px; margin-bottom: 8px; }
        .message li { margin-bottom: 4px; }
        .message strong { font-weight: 700; color: inherit; }

        /* ===== RESPONSIVE TABLES ===== */
        .message table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 0.85rem;
        }
        .message th,
        .message td {
            border: 1px solid rgba(0, 0, 0, 0.12);
            padding: 8px 10px;
            text-align: left;
        }
        .message th {
            background: rgba(10, 93, 63, 0.1);
            font-weight: 600;
            color: var(--court-green);
        }
        .message tr:nth-child(even) td {
            background: rgba(0, 0, 0, 0.02);
        }
        .message tr:hover td {
            background: rgba(10, 93, 63, 0.05);
        }

        /* Table wrapper for horizontal scroll on small screens */
        .message .table-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 12px 0;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.08);
        }
        .message .table-wrapper table {
            margin: 0;
            border-radius: 0;
        }

        /* ===== INPUT AREA ===== */
        .input-area {
            position: relative;
            z-index: 10;
            padding: 15px 15px 10px 15px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(10, 93, 63, 0.2);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            transition: transform 0.35s ease, opacity 0.35s ease;
        }

        .input-area.hidden {
            transform: translateY(calc(100% + 10px));
            opacity: 0;
            pointer-events: none;
        }

        #chat-container.input-hidden {
            padding-bottom: 16px;
        }

        .input-footer {
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            color: rgba(0, 0, 0, 0.4);
            padding: 8px 0 12px 0;
            letter-spacing: 0.3px;
        }

        .input-wrapper {
            flex: 1;
        }

        textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.1);
            padding: 12px 18px;
            border-radius: 12px;
            color: rgba(0, 0, 0, 0.9);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            resize: none;
            display: block;
        }

        textarea::placeholder {
            color: rgba(0, 0, 0, 0.4);
        }

        textarea:focus {
            border-color: var(--court-green);
            box-shadow: 0 0 15px rgba(10, 93, 63, 0.2);
        }

        button#send-btn {
            padding: 12px 22px;
            background: linear-gradient(135deg, var(--court-green), var(--court-green-light));
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(10, 93, 63, 0.3);
        }

        button#send-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(10, 93, 63, 0.4);
        }

        /* ===== WELCOME SCREEN ===== */
        #welcome-screen {
            text-align: center;
            margin: auto;
            max-width: 480px;
            padding: 40px 30px;
            background: rgba(0, 0, 0, 0.03);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(0, 0, 0, 0.06);
        }

        #welcome-screen .welcome-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        #welcome-screen h2 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            color: #1e293b;
            font-weight: 700;
        }

        #welcome-screen p {
            color: rgba(0, 0, 0, 0.5);
            line-height: 1.6;
            font-size: 0.95rem;
        }

        /* Loading dots */
        .loading-dots span {
            animation: bounce 0.6s infinite alternate;
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--court-green);
            border-radius: 50%;
            margin: 0 2px;
        }

        @keyframes bounce {
            to { transform: translateY(-5px); opacity: 0.5; }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="tech-bg">
        <div class="cyber-grid"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="lightning"></div>
        <div class="lightning"></div>
        <div class="lightning"></div>
        <div class="lightning"></div>
        <div class="lightning"></div>
        <div class="lightning"></div>
        <div class="glow-dot"></div>
        <div class="glow-dot"></div>
        <div class="glow-dot"></div>
        <div class="glow-dot"></div>
        <div class="glow-dot"></div>
    </div>

    <header>
        <div class='logo-text'>
            <div class=.logo-icon.></div>
            <h1>RANI</h1>
        </div>
        <button id='clear-chat'>Hapus Chat</button>
    </header>

    <div id='chat-container'>
        <div id='welcome-screen'>
            <div class='welcome-icon'>&#x2696;&#xFE0F;</div>
            <h2>RANI - Responsive Assistant N Intelligent</h2>
            <p>Asisten virtual Pengadilan Agama Medan siap membantu Anda memberikan informasi layanan hukum dengan cepat dan akurat.</p>
        </div>
    </div>

    <div class='input-area'>
        <div class='input-wrapper'>
            <textarea id='user-input' rows='2' placeholder='Ketik pertanyaan Anda di sini...' autocomplete='off'></textarea>
        </div>
        <button id='send-btn'>
            Kirim
            <svg width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'
                stroke-linecap='round' stroke-linejoin='round'>
                <line x1='22' y1='2' x2='11' y2='13'></line>
                <polygon points='22 2 15 22 11 13 2 9 22 2'></polygon>
            </svg>
        </button>
        <div class="input-footer">&copy; 2025 - Pengadilan Agama Medan</div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const welcomeScreenElement = document.getElementById('welcome-screen');
        const clearBtn = document.getElementById('clear-chat');
        const inputArea = document.querySelector('.input-area');

        let isLoading = false;

        function addMessage(text, role, cached) {
            if (welcomeScreenElement && chatContainer.contains(welcomeScreenElement)) {
                welcomeScreenElement.style.display = 'none';
            }
            let div = document.createElement('div');
            div.className = 'message ' + role + '-message';
            if (role === 'ai') {
                div.innerHTML = marked.parse(text);
                // Wrap tables in .table-wrapper for horizontal scroll on small screens
                div.querySelectorAll('table').forEach(function(table) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'table-wrapper';
                    table.parentNode.insertBefore(wrapper, table);
                    wrapper.appendChild(table);
                });
                if (cached) {
                    const badge = document.createElement('div');
                    badge.style.cssText = 'font-size:0.7rem;color:var(--court-gold);margin-top:6px;font-weight:600;letter-spacing:0.5px;';
                    badge.textContent = '⚡ dari cache';
                    div.appendChild(badge);
                }
                const row = document.createElement('div');
                row.className = 'ai-row';
                row.appendChild(div);
                div = row;
            } else {
                div.innerText = text;
            }
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }

        function getSessionId() {
            let sid = localStorage.getItem('rani_session_id');
            if (!sid) {
                sid = 'session_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
                localStorage.setItem('rani_session_id', sid);
            }
            return sid;
        }

        const sessionId = getSessionId();

        async function loadChatHistory() {
            const sid = localStorage.getItem("rani_session_id");
            if (!sid) return;
            try {
                const res = await fetch("/api/rani/history?session_id=" + encodeURIComponent(sid));
                const data = await res.json();
                if (data.messages) {
                    data.messages.forEach(function(msg) {
                        addMessage(msg.message, msg.role === "rani" ? "ai" : "user");
                    });
                }
            } catch(e) {
                console.log("History unavailable", e);
            }
        }

        loadChatHistory();

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || isLoading) return;

            isLoading = true;
            sendBtn.disabled = true;
            sendBtn.style.opacity = '0.6';

            addMessage(text, 'user');
            userInput.value = '';

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'ai-row';
            loadingDiv.innerHTML = '<div class="message ai-message"><div class="loading-dots"><span></span><span></span><span></span></div></div>';
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('/api/rani', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        pertanyaan: text,
                        session_id: sessionId
                    })
                });
                const data = await response.json();
                loadingDiv.remove();
                if (data.jawaban) {
                    addMessage(data.jawaban, 'ai', data.cached);
                } else if (data.message) {
                    addMessage('😔 ' + data.message, 'ai');
                } else {
                    addMessage('Maaf, terjadi gangguan teknis. Silakan coba lagi.', 'ai');
                }
            } catch (error) {
                loadingDiv.remove();
                addMessage('Maaf, layanan tidak tersedia saat ini. Pastikan server RANI sudah aktif.', 'ai');
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                sendBtn.style.opacity = '1';
                userInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });

        clearBtn.addEventListener('click', async () => {
            if (!confirm('Hapus seluruh percakapan?')) return;
            const sid = localStorage.getItem('rani_session_id');
            if (sid) {
                try {
                    await fetch('/api/rani/history?session_id=' + encodeURIComponent(sid), { method: 'DELETE' });
                } catch(e) {
                    console.log('Gagal hapus history di server', e);
                }
            }
            localStorage.removeItem('rani_session_id');
            location.reload();
        });

    </script>
</body>
</html>
